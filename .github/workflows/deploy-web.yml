name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'package-lock.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          # Satu project Supabase untuk mobile dan web, jadi secret Expo dipakai ulang.
          VITE_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          VITE_STORAGE_DRIVER: ${{ vars.VITE_STORAGE_DRIVER || 'supabase' }}
          VITE_R2_PUBLIC_BASE_URL: ${{ vars.VITE_R2_PUBLIC_BASE_URL }}
      # Project Cloudflare Pages "palti-fx" (direct upload) → https://palti-fx.pages.dev
      # Dijalankan dari web/ agar folder functions/ (Pages Function /api/upload-url) ikut ter-deploy.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name palti-fx --branch main --commit-hash ${{ github.sha }}
