name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: mobile
      - run: npm run test:coverage
        working-directory: mobile

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:db
        working-directory: mobile

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Cloudflare Pages membangun dari folder web/ dengan lockfile-nya sendiri (`npm ci --workspaces=false`).
      # Bila web/package-lock.json tertinggal dari package.json, build di Cloudflare gagal; tangkap di sini.
      - name: Lockfile web sinkron dengan package.json (dipakai build Cloudflare Pages)
        run: npm ci --workspaces=false --include=dev --dry-run
        working-directory: web
      - run: npm run lint
        working-directory: web
        continue-on-error: true
      - run: npm run test:coverage
        working-directory: web
      - run: npm run build
        working-directory: web
