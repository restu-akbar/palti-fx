name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: mobile
      - run: npm run test:coverage
        working-directory: mobile

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
        working-directory: web
        continue-on-error: true
      - run: npm run test:coverage
        working-directory: web
      - run: npm run build
        working-directory: web
